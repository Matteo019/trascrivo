# Test su GitHub, poi deploy sul server di casa con il runner self-hosted.
# Parte SOLO con un push su main (o a mano), MAI dalle pull request: il repository è pubblico e
# il runner esegue codice sul server.
name: Test e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check trascrivo tests strumenti
      - run: pytest -q

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    env:
      # variabile facoltativa del repository; senza, il .env è ~/trascrivo/.env sul server
      # (i segreti restano lì: fuori da GitHub e fuori dalla cartella di lavoro del runner)
      TRASCRIVO_ENV_FILE: ${{ vars.TRASCRIVO_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Controlla il file .env
        run: |
          ENV_FILE="${TRASCRIVO_ENV_FILE:-$HOME/trascrivo/.env}"
          test -f "$ENV_FILE" || { echo "Manca $ENV_FILE sul server (copia .env.example e compilalo)"; exit 1; }
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
      - name: Build e avvio
        run: docker compose --env-file "$ENV_FILE" up -d --build --remove-orphans
      - name: Collega il Cloudflare Tunnel
        run: sh strumenti/collega_tunnel.sh
      - name: Attendi che il servizio sia sano
        run: |
          for i in $(seq 1 30); do
            stato=$(docker inspect -f '{{.State.Health.Status}}' trascrivo-web 2>/dev/null || echo assente)
            [ "$stato" = healthy ] && { echo "trascrivo-web: healthy"; exit 0; }
            sleep 5
          done
          docker compose --env-file "$ENV_FILE" logs --tail 50 web worker
          exit 1
      - name: Pulisci immagini vecchie
        if: always()
        run: docker image prune -f
