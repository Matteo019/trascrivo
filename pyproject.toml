[project]
name = "trascrivo"
version = "2.0.0"
description = "Servizio web di trascrizione in differita con Whisper in locale"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S608", "B008"]  # B008: Depends() nei parametri è lo stile FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"strumenti/*" = ["E501"]
